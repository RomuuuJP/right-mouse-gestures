<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Right Mouse Gestures — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="logo" aria-hidden="true">↗</div>
      <div><p class="eyebrow" data-i18n="eyebrow">CHROME EXTENSION</p><h1 data-i18n="title">鼠标手势设置</h1><p class="subtitle" data-i18n="subtitle">按住右键移动，松开后执行手势。</p></div>
      <span class="version">v1.1.0</span>
    </header>

    <section class="panel">
      <div class="section-heading"><div><h2 data-i18n="generalTitle">常规设置</h2><p data-i18n="generalDesc">自定义识别手感和界面语言。</p></div></div>
      <div class="setting-row">
        <div class="setting-copy"><label for="language" data-i18n="languageLabel">显示语言</label><p data-i18n="languageHelp">更改设置页和手势提示的语言。</p></div>
        <select id="language"><option value="zh-CN">简体中文</option><option value="ja">日本語</option><option value="en">English</option></select>
      </div>
      <div class="setting-row sensitivity-row">
        <div class="setting-copy"><label for="sensitivity" data-i18n="sensitivityLabel">手势灵敏度</label><p data-i18n="sensitivityHelp">越高越容易识别短距离移动；越低则需要更明显的移动。</p></div>
        <div class="range-wrap"><div class="range-labels"><span data-i18n="lessSensitive">低</span><strong id="sensitivityValue">60%</strong><span data-i18n="moreSensitive">高</span></div><input id="sensitivity" type="range" min="1" max="100" value="60"><p class="hint" id="sensitivityHint"></p></div>
      </div>
      <div class="setting-row">
        <div class="setting-copy"><label data-i18n="previewLabel">手势预览</label><p data-i18n="previewHelp">提示会显示识别到的方向和对应指令。</p></div>
        <div class="preview-chip"><span class="preview-path">↘</span><span data-i18n="previewText">关闭当前选项卡</span></div>
      </div>
      <div class="actions"><span class="save-status" id="saveStatus" role="status" aria-live="polite"></span><button id="reset" class="secondary" data-i18n="reset">恢复默认</button><button id="save" class="primary" data-i18n="save">保存设置</button></div>
    </section>

    <section class="panel gestures-panel">
      <div class="section-heading"><div><h2 data-i18n="gesturesTitle">手势说明</h2><p data-i18n="gesturesDesc">在网页中按住鼠标右键，按下列方向移动。</p></div></div>
      <div class="gesture-grid" id="gestureGrid">
        <div class="gesture-card"><kbd>→</kbd><span data-i18n="forward">前进</span></div><div class="gesture-card"><kbd>←</kbd><span data-i18n="back">返回</span></div>
        <div class="gesture-card"><kbd>↑</kbd><span data-i18n="scrollUp">向上滚动</span></div><div class="gesture-card"><kbd>↓</kbd><span data-i18n="scrollDown">向下滚动</span></div>
        <div class="gesture-card"><kbd>↑↓ / ↓↑</kbd><span data-i18n="reload">刷新页面</span></div><div class="gesture-card"><kbd>↓→</kbd><span data-i18n="closeTab">关闭当前选项卡</span></div>
        <div class="gesture-card"><kbd>↑←</kbd><span data-i18n="tabLeft">切换到左侧选项卡</span></div><div class="gesture-card"><kbd>↑→</kbd><span data-i18n="tabRight">切换到右侧选项卡</span></div>
      </div>
      <p class="footnote" data-i18n="cancelNote">不匹配任何指令的手势会被取消，不执行操作。</p>
    </section>
    <footer data-i18n="footer">设置会自动保存到此 Chrome 用户配置中。</footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
